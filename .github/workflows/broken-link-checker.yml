name: Check for Broken Links
on: [push, pull_request]

jobs:
  build_and_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16

      - name: Install dependencies
        run: yarn install

      - name: Build website
        run: yarn build

      - name: Setup Simple HTTP Server
        run: nohup yarn start &

      - name: Check HTTP Server status
        run: sleep 5 && curl -I http://127.0.0.1:8080

      - name: Install Broken Link Checker
        run: npm install -g broken-link-checker

      - name: Execute Link Checker and Show Broken Links
        env:
          TEMPORARY_WEBSITE_URL: 'http://127.0.0.1:8080'
          ACTUAL_WEBSITE_URL: 'https://ddmal.ca/Neon/'
        run: |
          # Function to extract URLs from broken link output
          extract_urls() {
            echo "$1" | sed -n 's/.*├─BROKEN─ \(https\?:\/\/[^[:space:]]*\).*/\1/p'
          }

          # Function to retry URLs with retryable errors
          retry_urls() {
            local urls="$1"
            local retry_results=""

            echo "$urls" | while read -r url; do
              [ -z "$url" ] && continue
              echo "Retrying: $url"

              # Try up to 3 times with different approaches
              for attempt in 1 2 3; do
                if curl -L -s -o /dev/null -w "%{http_code}" \
                   -H "User-Agent: Mozilla/5.0 (compatible; BrokenLinkChecker)" \
                   --connect-timeout 30 --max-time 60 "$url" | \
                   grep -E "^(200|301|302|303)$" > /dev/null; then
                  echo "✓ Success on attempt $attempt: $url"
                  echo "RETRY_SUCCESS:$url" >> /tmp/retry_results
                  break
                elif [ $attempt -eq 3 ]; then
                  echo "✗ Failed after 3 attempts: $url"
                  echo "RETRY_FAILED:$url" >> /tmp/retry_results
                else
                  echo "Retrying in 5 seconds..."
                  sleep 5
                fi
              done
            done
          }

          # Initialize retry results file
          > /tmp/retry_results

          # Run broken link checker and filter output
          echo "Running broken link check..."
          output=$(blc $TEMPORARY_WEBSITE_URL --filter-level=3 | \
            grep -v -E '├───OK───|└───OK───' | \
            awk '
              BEGIN { buf="" }
              /^Getting links from:/ { buf=$0; next }
              /^Finished!.*0 broken\./ {
                if (length(buf)>0) { buf=""; next }
              }
              {
                if(length(buf)>0) print buf
                if (NF > 0) print
                buf=""
              }
              /^Finished!/ { print "" }
            ' | sed "s|$TEMPORARY_WEBSITE_URL|$ACTUAL_WEBSITE_URL|g")

          echo "Initial link check results:"
          echo "$output"

          # Handle retryable errors
          retryable_urls=$(echo "$output" | grep -E "(BLC_UNKNOWN|HTTP_429)" | extract_urls)
          if [ -n "$retryable_urls" ]; then
            echo ""
            echo "Retrying URLs with temporary errors..."
            retry_urls "$retryable_urls"
          fi

          # Determine final status
          has_errors=false

          # Check for 4xx errors
          if echo "$output" | grep -Eq 'HTTP_4[0-9]{2}'; then
            # Get URLs that were successfully retried
            successful_urls=""
            if [ -f /tmp/retry_results ]; then
              successful_urls=$(grep "^RETRY_SUCCESS:" /tmp/retry_results | cut -d: -f2-)
            fi

            # Find 4xx errors not resolved by retries
            unresolved_4xx=$(echo "$output" | grep 'HTTP_4[0-9]{2}' | while read -r line; do
              url=$(echo "$line" | extract_urls)
              if [ -n "$url" ] && ! echo "$successful_urls" | grep -Fxq "$url"; then
                echo "$line"
              fi
            done)

            if [ -n "$unresolved_4xx" ]; then
              echo ""
              echo "Unresolved HTTP 4xx errors found:"
              echo "$unresolved_4xx"
              has_errors=true
            fi

            # Check for failed retries
            if [ -f /tmp/retry_results ] && grep -q "^RETRY_FAILED:" /tmp/retry_results; then
              echo ""
              echo "URLs that failed after retries:"
              grep "^RETRY_FAILED:" /tmp/retry_results | cut -d: -f2-
              has_errors=true
            fi
          fi

          # Final result
          echo ""
          if [ "$has_errors" = true ]; then
            echo "❌ Broken links found that could not be resolved."
            exit 1
          else
            echo "✅ No broken links found (or all issues resolved via retries)."
            exit 0
          fi
