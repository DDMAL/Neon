name: Check for Broken Links
on: [push, pull_request]
jobs:
  build_and_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16

      - name: Install dependencies
        run: yarn install

      - name: Build website
        run: yarn build

      - name: Setup Simple HTTP Server
        run: |
          nohup yarn start &

      - name: Check HTTP Server status
        run: sleep 5 && curl -I http://127.0.0.1:8080

      - name: Install Broken Link Checker
        run: npm install -g broken-link-checker

      - name: Execute Link Checker and Show Broken Links
        env:
          TEMPORARY_WEBSITE_URL: 'http://127.0.0.1:8080'
          ACTUAL_WEBSITE_URL: 'https://ddmal.ca/Neon/'
        run: |
          # Function to retry URLs that failed with retryable errors
          retry_retryable_urls() {
            local failed_urls="$1"
            local retry_results=""

            # Extract URLs that failed with retryable errors (BLC_UNKNOWN, HTTP_429)
            local retryable_urls=$(echo "$failed_urls" | grep -E "(BLC_UNKNOWN|HTTP_429)" | sed -n 's/.*├─BROKEN─ \(https\?:\/\/[^[:space:]]*\).*/\1/p')

            if [ -z "$retryable_urls" ]; then
              return
            fi

            # Process each URL (avoid pipe to while loop to prevent subshell issues)
            while IFS= read -r url; do
              if [ -n "$url" ]; then
                echo "Retrying URL with retryable error: $url"

                # Try with curl with retries and different user agents
                local retry_success=false
                for attempt in 1 2 3; do
                  echo "Attempt $attempt for $url"

                  if curl -L -s -o /dev/null -w "%{http_code}" \
                     -H "User-Agent: Mozilla/5.0 (compatible; BrokenLinkChecker)" \
                     --connect-timeout 30 \
                     --max-time 60 \
                     "$url" | grep -E "^(200|301|302|303)$" > /dev/null; then
                    echo "✓ URL accessible on attempt $attempt: $url"
                    retry_success=true
                    break
                  fi

                  if [ $attempt -lt 3 ]; then
                    echo "Retrying in 5 seconds..."
                    sleep 5
                  fi
                done

                if [ "$retry_success" = true ]; then
                  retry_results+="RETRY_SUCCESS: $url"$'\n'
                else
                  retry_results+="RETRY_FAILED: $url"$'\n'
                fi
              fi
            done <<< "$retryable_urls"

            echo "$retry_results"
          }

          # Run initial link check
          echo "Running initial broken link check..."
          output=$(blc $TEMPORARY_WEBSITE_URL --filter-level=3 | \
            grep -v -E '├───OK───|└───OK───' | \
            awk '
              BEGIN {
                p=1;
                buf=""
              }

              # The logic between the following two statements ensures lines started with "Getting links from:"
              # and immediately followed by a line starting with "Finished!" and containing "0 broken" get removed
              /^Getting links from:/ {
                buf=$0;
                next
              }
              /^Finished!.*0 broken\./ {
                if (length(buf)>0) {
                  buf="";
                  next
                }
              }

              {
                if(length(buf)>0)
                  print buf;
                if (NF > 0) # ensures only lines with non-zero fields are printed
                  print;
                buf=""
              }

              # Printing an empty line after any single "Finished!" keyword to separate the outputs
              /^Finished!/ {
                print ""
              }
            ' | sed "s|$TEMPORARY_WEBSITE_URL|$ACTUAL_WEBSITE_URL|g")

          echo "Initial link check results:"
          echo "$output"

          # Check for retryable errors and retry them
          retry_output=""
          if echo "$output" | grep -E "(BLC_UNKNOWN|HTTP_429)"; then
            echo ""
            echo "Detected URLs with retryable errors. Running retries..."
            retry_output=$(retry_retryable_urls "$output")
            echo "$retry_output"
          fi

          # Determine final status
          final_flag=0

          # Check for any HTTP 4xx errors that weren't successfully retried
          if echo "$output" | grep -Eq 'HTTP_4[0-9]{2}'; then
            # If we have retry results, check if they succeeded
            if [ -n "$retry_output" ]; then
              # Check if any retries failed
              if echo "$retry_output" | grep -q "RETRY_FAILED:"; then
                echo ""
                echo "Some URLs failed even after retries:"
                echo "$retry_output" | grep "RETRY_FAILED:"
                final_flag=1
              else
                echo ""
                echo "All retryable URLs were successfully verified!"
              fi

              # Get list of successfully retried URLs
              successful_retry_urls=$(echo "$retry_output" | grep "RETRY_SUCCESS:" | sed 's/RETRY_SUCCESS: //')

              # Check for 4xx errors from URLs that were NOT successfully retried
              if [ -n "$successful_retry_urls" ]; then
                # Filter out lines containing successfully retried URLs
                other_4xx_lines=""
                while IFS= read -r line; do
                  if echo "$line" | grep -q 'HTTP_4[0-9]{2}'; then
                    # Extract URL from this line
                    url_in_line=$(echo "$line" | sed -n 's/.*├─BROKEN─ \(https\?:\/\/[^[:space:]]*\).*/\1/p')

                    # Check if this URL is NOT in the successful retry list
                    if ! echo "$successful_retry_urls" | grep -Fxq "$url_in_line"; then
                      other_4xx_lines+="$line"$'\n'
                    fi
                  fi
                done <<< "$output"
              else
                # No successful retries, so all 4xx errors are problematic
                other_4xx_lines=$(echo "$output" | grep 'HTTP_4[0-9]{2}')
              fi

              if [ -n "$other_4xx_lines" ]; then
                echo ""
                echo "Found HTTP 4xx errors not resolved by retries:"
                echo "$other_4xx_lines"
                final_flag=1
              fi
            else
              # No retry output means all 4xx errors are problematic
              final_flag=1
            fi
          fi

          if [ "$final_flag" -eq "1" ]; then
            echo ""
            echo "Broken links were found that could not be resolved, exiting with an error."
            exit 1
          else
            echo ""
            echo "No broken links were found (or all issues were resolved via retries), exiting successfully."
            exit 0
          fi
