name: Scheduled E2E on Chrome
on:
  schedule:
    - cron: '0 7 * * 0' # Runs every Sunday at 02:00 Montreal time (EST) / 03:00 Montreal time (EDT)
  workflow_dispatch:

# Never run two scheduled/dispatched runs at once.
concurrency:
  group: e2e-chrome-scheduled
  cancel-in-progress: false

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # let's make sure our tests pass on Chrome browser
    name: Scheduled E2E on Chrome
    steps:
      - uses: actions/checkout@v4
      # Node 16 is EOL, but it is load-bearing here: webpack 4 uses the legacy
      # OpenSSL hashing that Node 17+ rejects (ERR_OSSL_EVP_UNSUPPORTED), which
      # is why the Dockerfile sets NODE_OPTIONS=--openssl-legacy-provider.
      # Bumping this needs that flag or a webpack 5 migration first.
      - name: Set Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - uses: cypress-io/github-action@v6
        with:
          build: yarn build:prod
          start: yarn start
          # `yarn start` is a bare http-server with no readiness signal, and the
          # action does not wait implicitly -- without this, Cypress races the
          # server on a cold runner.
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 120
          browser: chrome
      # Screenshots and videos are the only evidence a headless failure leaves.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-scheduled
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
