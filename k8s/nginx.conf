server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Revalidate compiled assets because their filenames are reused across deployments.
    location /Neon-gh/ {
        expires off;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
