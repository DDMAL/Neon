apiVersion: apps/v1
kind: Deployment
metadata:
  name: neon
  namespace: neon
  labels:
    app: neon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neon
  template:
    metadata:
      labels:
        app: neon
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: neon
          image: ghcr.io/ddmal/neon:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: nginx-conf
          configMap:
            name: neon-nginx-conf
